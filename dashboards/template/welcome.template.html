<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome to your social dashboard</title>
<style>/*__SHELL_CSS__*/</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
<script src="/supabase/config.js"></script>
</head>
<body style="display:block">

<div id="authGate" class="auth-gate"></div>
<div id="appShell" class="hidden" style="display:block">
  <div class="welcome">
    <div class="brand"><img src="/assets/logo-white.png" alt="Fully Launched" style="width:180px"></div>
    <div id="opBanner"></div>
    <nav class="steps" id="steps" aria-label="Onboarding steps"></nav>
    <main id="stepBody"></main>
  </div>
</div>

<script>/*__SHELL_JS__*/</script>
<script>/*__AUTH_JS__*/</script>
<script>
// /welcome — a new client's onboarding (onboarding v2, Tait 2026-10-01):
//   1. Create your password: one big page on its own, no step tabs.
//   2. Then the steps, with tabs across the top. A step opens only once the
//      one before it is done:
//        Welcome      "about 30 minutes, come back any time" → Start
//        Your brand   drag-and-drop brand files, or "I don't have any brand files"
//        The questions  one page: the questions and a voice memo recorder
//                     (record here, or upload a recording)
//        Your footage drag-and-drop files or whole folders, and/or a Google
//                     Drive folder link
//   3. Their portal, with a short walkthrough and a "bookmark this" pop-up
//      (/clients/<slug>?tour=1).
// Uploads go to the private 'onboarding' storage bucket under the client's
// own folder (migration 010), at full quality: files are sent as they are,
// and anything over 6 MB goes in resumable pieces (tus), so big videos
// survive a shaky connection. Every step is saved with
// social_client_onboarding_save(), so they can stop and come back.
//
// /welcome?mode=reset is the "Set a new password" page for anyone (the
// Forgot password email lands here), then sends them to their dashboard.
// An operator can open /welcome?client=<slug> to see a client's steps
// (nothing they do there changes their own password).

const params = new URLSearchParams(location.search);
const RESET = params.get("mode") === "reset";
const BUCKET = "onboarding";
const RESUMABLE_OVER = 6 * 1024 * 1024;   // bytes; tus needs 6 MB pieces on Supabase
let ME = null, ROLE = null, CLIENT = null, OB = null;
let current = null;
// Files in flight or done this visit, per drop zone: { name, size, path, pct, status: "uploading"|"done"|"error", error }
const UPLOADS = { brand: [], footage: [] };
let memo = { state: "none" };   // none | recording | recorded | uploading | error

function stepList() {
  if (RESET) return [];
  return [
    { key: "welcome", label: "Welcome" },
    { key: "brand", label: "Your brand" },
    { key: "questions", label: "The questions" },
    { key: "footage", label: "Your footage" },
  ];
}
const brandOf = () => (OB && OB.brand) || {};
const footageOf = () => (OB && OB.footage) || {};
function isDone(key) {
  const o = OB || {}, b = brandOf();
  return {
    password: !!o.password_set_at,
    welcome: !!(o.started_at || b.done || ["uploaded", "none"].includes(b.files) || o.voice_memo_path || o.footage_done_at),
    brand: !!(b.done || ["uploaded", "none"].includes(b.files)),
    questions: !!o.voice_memo_path,
    footage: !!o.footage_done_at,
  }[key];
}
// A step opens once every step before it is done.
function canOpen(key) {
  const s = stepList(), i = s.findIndex(x => x.key === key);
  return s.slice(0, i).every(x => isDone(x.key));
}
function firstOpenStep() {
  if (RESET) return "password";
  if (ROLE !== "operator" && !(OB && OB.password_set_at)) return "password";
  const s = stepList();
  const open = s.find(x => !isDone(x.key));
  return (open || s[s.length - 1]).key;
}

async function save(step, data) {
  if (RESET) return { data: null, error: null };
  const r = await sbClient.rpc("social_client_onboarding_save", { p_client_id: CLIENT.id, p_step: step, p_data: data || {} });
  if (!r.error && r.data) OB = r.data;
  return r;
}

function go(key) { current = key; render(); window.scrollTo(0, 0); }
function next() { const s = stepList(), i = s.findIndex(x => x.key === current); if (i >= 0 && i < s.length - 1) go(s[i + 1].key); }

function render() {
  const onPassword = current === "password";
  document.getElementById("steps").innerHTML = onPassword ? "" : stepList().map(s => {
    const open = canOpen(s.key), done = isDone(s.key);
    return `<button type="button" class="${s.key === current ? "on" : done ? "done" : ""}${open ? "" : " locked"}" data-step="${s.key}" ${open ? "" : "disabled aria-disabled=\"true\" title=\"Finish the step before this one first\""}>${done ? "✓ " : ""}${escapeHtml(s.label)}</button>`;
  }).join("");
  document.querySelectorAll("#steps [data-step]").forEach(b => b.onclick = () => { if (canOpen(b.dataset.step)) go(b.dataset.step); });
  const body = document.getElementById("stepBody");
  body.innerHTML = `<section class="wstep${onPassword ? " pw-page" : ""}" data-current="${current}">${STEPS[current]()}</section>`;
  (WIRE[current] || (() => {}))(body);
}
const errHtml = `<div class="auth-error" data-err></div>`;
const setErr = (body, msg) => { const e = body.querySelector("[data-err]"); if (e) e.textContent = msg || ""; };
const EYE = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_OFF = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
const pwField = (id, label) => `<label for="${id}">${label}</label>
  <div class="pw-wrap"><input type="password" id="${id}" autocomplete="new-password"><button type="button" class="pw-eye" data-eye="${id}" aria-label="Show password" title="Show password">${EYE}</button></div>`;
const fmtSize = n => n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1e3)) + " KB";

// ---------- uploads ----------
// Storage keys allow a limited set of characters; keep names readable.
const safeName = s => String(s || "file").replace(/[^A-Za-z0-9._\-()\/]+/g, "_").replace(/_+/g, "_").replace(/^\/+/, "");
async function uploadFile(path, file, onProgress) {
  const contentType = file.type || "application/octet-stream";
  if (window.tus && file.size > RESUMABLE_OVER) {
    const { data } = await sbClient.auth.getSession();
    const token = data && data.session && data.session.access_token;
    await new Promise((resolve, reject) => {
      const up = new tus.Upload(file, {
        endpoint: window.SUPABASE_CONFIG.url + "/storage/v1/upload/resumable",
        retryDelays: [0, 3000, 5000, 10000, 20000],
        headers: { authorization: "Bearer " + token, "x-upsert": "false" },
        uploadDataDuringCreation: true,
        removeFingerprintOnSuccess: true,
        metadata: { bucketName: BUCKET, objectName: path, contentType, cacheControl: "3600" },
        chunkSize: RESUMABLE_OVER,
        onError: reject,
        onProgress: (sent, total) => onProgress && onProgress(Math.round(sent / total * 100)),
        onSuccess: resolve,
      });
      up.findPreviousUploads().then(prev => { if (prev.length) up.resumeFromPreviousUpload(prev[0]); up.start(); });
    });
    return path;
  }
  onProgress && onProgress(5);
  const { error } = await sbClient.storage.from(BUCKET).upload(path, file, { contentType, upsert: false });
  if (error) throw error;
  onProgress && onProgress(100);
  return path;
}
const uploading = () => UPLOADS.brand.concat(UPLOADS.footage).some(u => u.status === "uploading") || memo.state === "uploading";
window.addEventListener("beforeunload", e => { if (uploading()) { e.preventDefault(); e.returnValue = ""; } });

// A drop zone: drag and drop files (or folders, where allowed), or choose them.
function dropzoneHtml(zone, { folders }) {
  return `<div class="dropzone" data-zone="${zone}" tabindex="0">
    <input type="file" multiple hidden data-pick>
    ${folders ? `<input type="file" multiple webkitdirectory directory hidden data-pick-folder>` : ""}
    <div class="dz-title">Drag and drop ${folders ? "files or folders" : "your files"} here</div>
    <div class="dz-or">or</div>
    <div class="dz-buttons"><button type="button" class="primary" data-choose>Choose files</button>${folders ? `<button type="button" data-choose-folder>Choose a folder</button>` : ""}</div>
  </div>
  <div class="upload-list" data-list="${zone}"></div>`;
}
function uploadListHtml(zone) {
  const saved = (zone === "brand" ? brandOf().uploads : footageOf().files) || [];
  const live = UPLOADS[zone];
  const livePaths = new Set(live.map(u => u.path));
  const rows = saved.filter(f => !livePaths.has(f.path)).map(f => ({ ...f, status: "done" })).concat(live);
  if (!rows.length) return "";
  return rows.map(u => `<div class="upload-row ${u.status}">
    <div class="up-name">${u.status === "done" ? "✓ " : u.status === "error" ? "✕ " : ""}${escapeHtml(u.name)}<span class="meta"> · ${fmtSize(u.size || 0)}</span></div>
    ${u.status === "uploading" ? `<div class="up-bar"><div style="width:${u.pct || 0}%"></div></div>` : ""}
    ${u.status === "error" ? `<div class="meta">Didn't upload: ${escapeHtml(u.error || "unknown error")}. Try it again.</div>` : ""}
  </div>`).join("");
}
const doneUploads = zone => {
  const saved = (zone === "brand" ? brandOf().uploads : footageOf().files) || [];
  const seen = new Set(saved.map(f => f.path));
  return saved.concat(UPLOADS[zone].filter(u => u.status === "done" && !seen.has(u.path)).map(({ name, size, path }) => ({ name, size, path })));
};
// Folders dropped on the zone: walk them for their files, keeping the folder path.
async function filesFromDrop(dt) {
  const items = Array.from(dt.items || []).map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!items.length) return Array.from(dt.files || []).map(f => ({ file: f, rel: f.name }));
  const out = [];
  const walk = async (entry, prefix) => {
    if (entry.isFile) { const f = await new Promise((res, rej) => entry.file(res, rej)); out.push({ file: f, rel: prefix + f.name }); return; }
    const reader = entry.createReader();
    let batch;
    do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const e of batch) await walk(e, prefix + entry.name + "/"); } while (batch.length);
  };
  for (const e of items) await walk(e, "");
  return out;
}
// Upload a list of { file, rel } into a zone, one or two at a time.
async function handleFiles(zone, list, rerender) {
  if (!list.length) return;
  const batch = Date.now();
  const jobs = list.filter(x => x.file && x.file.size >= 0).map(({ file, rel }) => {
    const u = { name: rel || file.name, size: file.size, pct: 0, status: "uploading",
      path: `${CLIENT.id}/${zone}/${zone === "footage" ? batch + "/" + safeName(rel || file.name) : batch + "-" + safeName(file.name)}` };
    UPLOADS[zone].push(u);
    return { u, file };
  });
  rerender();
  const run = async ({ u, file }) => {
    try {
      await uploadFile(u.path, file, pct => { u.pct = pct; const bar = document.querySelector(`[data-list="${zone}"]`); if (bar) bar.innerHTML = uploadListHtml(zone); });
      u.status = "done";
      // Save as each file lands, so nothing is lost if they leave.
      if (zone === "brand") await save("brand", { ...brandOf(), uploads: doneUploads("brand") });
      else await save("footage", { ...footageOf(), files: doneUploads("footage"), done: false });
    } catch (e) { u.status = "error"; u.error = e.message || String(e); }
    rerender();
  };
  const queue = jobs.slice();
  await Promise.all([0, 1].map(async () => { while (queue.length) await run(queue.shift()); }));
}
function wireDropzone(body, zone, rerender) {
  const dz = body.querySelector(`[data-zone="${zone}"]`);
  const pick = dz.querySelector("[data-pick]"), pickFolder = dz.querySelector("[data-pick-folder]");
  dz.querySelector("[data-choose]").onclick = () => pick.click();
  if (pickFolder) dz.querySelector("[data-choose-folder]").onclick = () => pickFolder.click();
  const fromInput = input => Array.from(input.files || []).map(f => ({ file: f, rel: f.webkitRelativePath || f.name }));
  pick.onchange = () => { handleFiles(zone, fromInput(pick), rerender); pick.value = ""; };
  if (pickFolder) pickFolder.onchange = () => { handleFiles(zone, fromInput(pickFolder), rerender); pickFolder.value = ""; };
  dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
  dz.ondragleave = () => dz.classList.remove("over");
  dz.ondrop = async e => { e.preventDefault(); dz.classList.remove("over"); handleFiles(zone, await filesFromDrop(e.dataTransfer), rerender); };
}

// ---------- the voice memo ----------
const canRecord = () => !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let recorder = null, recChunks = [], recTimer = null, recStart = 0;
function memoHtml() {
  const saved = OB && OB.voice_memo_path;
  if (memo.state === "recording") return `<div class="memo-rec"><span class="rec-dot"></span> Recording <b id="recTime">0:00</b></div>
    <p class="meta">Keep this page open while you talk. Tap Stop when you're finished.</p>
    <button type="button" class="accent" data-stop>Stop</button>`;
  if (memo.state === "recorded") return `<p class="meta">Listen back if you like, then save it.</p>
    <audio controls src="${memo.url}" style="width:100%"></audio>
    <div class="dz-buttons" style="margin-top:12px"><button type="button" class="primary" data-memo-save>Save my voice memo</button><button type="button" data-redo>Record again</button></div>`;
  if (memo.state === "uploading") return `<p>Saving your voice memo… <b>${memo.pct || 0}%</b></p><div class="up-bar"><div style="width:${memo.pct || 0}%"></div></div><p class="meta">Keep this page open until it's saved.</p>`;
  return `${saved ? `<div class="memo-saved">✓ Your voice memo is saved.</div><p class="meta">Want to replace it? Record or upload a new one.</p>` : `<p class="meta">Tap Record and talk through your answers in one go. About 15 to 25 minutes is perfect. Already recorded one on your phone? Upload it instead.</p>`}
    ${memo.state === "error" ? `<p class="auth-error">${escapeHtml(memo.error || "That didn't work.")}</p>` : ""}
    <div class="dz-buttons">${canRecord() ? `<button type="button" class="accent" data-rec>● Record</button>` : ""}<button type="button" ${canRecord() ? "" : `class="primary"`} data-memo-pick>Upload a recording</button></div>
    <input type="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.caf" hidden data-memo-file>`;
}
async function saveMemoFile(file, rerender) {
  const ext = (file.name && file.name.includes(".")) ? file.name.split(".").pop().toLowerCase() : (file.type.includes("mp4") ? "m4a" : file.type.includes("ogg") ? "ogg" : "webm");
  const path = `${CLIENT.id}/voice-memo/${Date.now()}-voice-memo.${safeName(ext)}`;
  memo = { state: "uploading", pct: 0 };
  rerender();
  try {
    await uploadFile(path, file, pct => { memo.pct = pct; const el = document.querySelector("[data-memo]"); if (el) el.innerHTML = memoHtml(); });
    const r = await save("voice_memo", { path, name: file.name || "voice memo", size: file.size });
    if (r.error) throw r.error;
    memo = { state: "none" };
  } catch (e) { memo = { state: "error", error: "Your voice memo didn't save: " + (e.message || e) + ". Try again." }; }
  rerender();
}
function wireMemo(body, rerender) {
  const box = body.querySelector("[data-memo]");
  const q = s => box.querySelector(s);
  if (q("[data-rec]")) q("[data-rec]").onclick = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
      recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      recChunks = [];
      recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        clearInterval(recTimer);
        const blob = new Blob(recChunks, { type: recorder.mimeType || "audio/webm" });
        memo = { state: "recorded", blob, url: URL.createObjectURL(blob) };
        rerender();
      };
      recorder.start(1000);
      recStart = Date.now();
      memo = { state: "recording" };
      rerender();
      recTimer = setInterval(() => { const t = document.getElementById("recTime"); if (t) { const s = Math.floor((Date.now() - recStart) / 1000); t.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); } }, 500);
    } catch (e) { memo = { state: "error", error: "We couldn't use your microphone (" + (e.message || e) + "). Allow microphone access, or upload a recording instead." }; rerender(); }
  };
  if (q("[data-stop]")) q("[data-stop]").onclick = () => recorder && recorder.state !== "inactive" && recorder.stop();
  if (q("[data-redo]")) q("[data-redo]").onclick = () => { memo = { state: "none" }; rerender(); };
  if (q("[data-memo-save]")) q("[data-memo-save]").onclick = () => {
    const ext = memo.blob.type.includes("mp4") ? "m4a" : "webm";
    saveMemoFile(new File([memo.blob], "voice-memo." + ext, { type: memo.blob.type }), rerender);
  };
  if (q("[data-memo-pick]")) { const input = q("[data-memo-file]"); q("[data-memo-pick]").onclick = () => input.click(); input.onchange = () => { if (input.files[0]) saveMemoFile(input.files[0], rerender); }; }
}

// ---------- the steps ----------
const STEPS = {
  password: () => `
    <div class="card pw-card">
      <h1>${RESET ? "Set a new password" : "Create your password"}</h1>
      <p class="lead">${RESET ? "Choose a new password for your login." : `Welcome${CLIENT ? ", " + escapeHtml(CLIENT.name) : ""}. Choose a password so you can sign in any time with your email.`}</p>
      ${ROLE === "operator" && !RESET ? `<p class="meta">You're previewing as the operator. The client sets their own password here; nothing changes yours.</p>` : `
      ${pwField("pw1", "Password (at least 8 characters)")}
      ${pwField("pw2", "Type it again")}`}
      <button type="button" class="accent pw-go" data-next>${RESET ? "Save password" : "Create my password"}</button>
      ${errHtml}
    </div>`,

  welcome: () => `
    <div class="card welcome-card">
      <h1>Welcome${CLIENT ? ", " + escapeHtml(CLIENT.name) : ""}</h1>
      <p class="lead">This takes around 30 minutes. You can stop and come back any time.</p>
      <button type="button" class="accent big" data-next>Start</button>
      ${errHtml}
    </div>`,

  brand: () => {
    const has = doneUploads("brand").length > 0;
    return `
    <h1>Your brand</h1>
    <p class="lead">Upload any brand documents that you have.</p>
    ${dropzoneHtml("brand", { folders: false })}
    <div class="wnav"><button type="button" data-none>I don't have any brand files</button>
      <button type="button" class="primary" data-next ${has && !uploading() ? "" : "disabled"}>I've uploaded my brand files, continue</button></div>
    ${errHtml}`;
  },

  questions: () => `
    <h1>The questions</h1>
    <p class="lead">Read the questions, then answer them in one voice memo at the bottom of this page. Talk the way you'd explain it to a friend.</p>
    <div class="card">${ONBOARDING_QUESTIONS.map(s => `<div class="qsec"><h3>${escapeHtml(s.section)}</h3><ol class="doc-body" style="margin:0 0 6px">${s.items.map(it => `
      <li class="qitem"><div class="q">${escapeHtml(it.q)}</div></li>`).join("")}</ol></div>`).join("")}</div>
    <div class="card memo-card"><h2>Your voice memo</h2><div data-memo>${memoHtml()}</div></div>
    <div class="wnav"><span></span><button type="button" class="primary" data-next ${OB && OB.voice_memo_path && memo.state !== "uploading" ? "" : "disabled"}>Continue</button></div>
    ${errHtml}`,

  footage: () => {
    const f = footageOf();
    const ready = doneUploads("footage").length > 0 || !!String(f.drive_link || "").trim();
    return `
    <h1>Your footage</h1>
    <p class="lead">Upload all of your existing footage. Drop in files or whole folders. Everything is saved at full quality.</p>
    ${dropzoneHtml("footage", { folders: true })}
    <div class="card"><label for="driveLink">Or share a Google Drive folder</label>
      <input type="text" id="driveLink" placeholder="Paste the link to your Google Drive folder" value="${escapeHtml(f.drive_link || "")}">
      <div class="meta" style="margin-top:6px">Set the folder to "Anyone with the link can view" so we can open it.</div></div>
    <div class="wnav"><button type="button" data-none>I don't have any footage</button>
      <button type="button" class="primary" data-next ${ready && !uploading() ? "" : "disabled"}>I'm done, take me to my portal</button></div>
    ${errHtml}`;
  },
};

const WIRE = {
  password: body => {
    body.querySelectorAll("[data-eye]").forEach(b => b.onclick = () => {
      const input = body.querySelector("#" + b.dataset.eye), show = input.type === "password";
      input.type = show ? "text" : "password";
      b.innerHTML = show ? EYE_OFF : EYE;
      b.setAttribute("aria-label", show ? "Hide password" : "Show password"); b.title = b.getAttribute("aria-label");
    });
    const btn = body.querySelector("[data-next]");
    btn.onclick = async () => {
      setErr(body, "");
      if (!(ROLE === "operator" && !RESET)) {
        const a = body.querySelector("#pw1").value, b = body.querySelector("#pw2").value;
        if (a.length < 8) return setErr(body, "Use at least 8 characters.");
        if (a !== b) return setErr(body, "Those two don't match.");
        btn.disabled = true;
        const { error } = await sbClient.auth.updateUser({ password: a });
        if (error) { btn.disabled = false; return setErr(body, error.message); }
        if (RESET) { setErr(body, "Saved. Taking you to your dashboard…"); location.href = await homeFor(ME); return; }
        const r = await save("password");
        if (r.error) { btn.disabled = false; return setErr(body, r.error.message); }
      }
      go("welcome");
    };
  },
  welcome: body => {
    const btn = body.querySelector("[data-next]");
    btn.onclick = async () => { btn.disabled = true; const r = await save("started"); if (r.error) { btn.disabled = false; return setErr(body, r.error.message); } next(); };
  },
  brand: body => {
    const rerender = () => { if (current === "brand") render(); };
    wireDropzone(body, "brand", rerender);
    body.querySelector('[data-list="brand"]').innerHTML = uploadListHtml("brand");
    const finish = files => async () => {
      setErr(body, "");
      const r = await save("brand", { files, uploads: doneUploads("brand"), done: true });
      if (r.error) return setErr(body, r.error.message);
      next();
    };
    body.querySelector("[data-none]").onclick = finish("none");
    body.querySelector("[data-next]").onclick = finish("uploaded");
  },
  questions: body => {
    const rerender = () => { if (current === "questions") { const y = window.scrollY; render(); window.scrollTo(0, y); } };
    wireMemo(body, rerender);
    body.querySelector("[data-next]").onclick = () => { if (OB && OB.voice_memo_path) next(); };
  },
  footage: body => {
    const rerender = () => {
      if (current !== "footage") return;
      const link = body.querySelector("#driveLink"), keep = link ? link.value : null;
      render();
      if (keep !== null) document.querySelector("#driveLink").value = keep;
      refreshFootageButton(document.getElementById("stepBody"));
    };
    wireDropzone(body, "footage", rerender);
    body.querySelector('[data-list="footage"]').innerHTML = uploadListHtml("footage");
    body.querySelector("#driveLink").oninput = () => refreshFootageButton(body);
    const finish = none => async () => {
      setErr(body, "");
      const btns = body.querySelectorAll(".wnav button"); btns.forEach(b => b.disabled = true);
      const drive_link = none ? "" : body.querySelector("#driveLink").value.trim();
      let r = await save("footage", { drive_link, files: doneUploads("footage"), none: !!none, done: true });
      if (!r.error) r = await save("done");
      if (r.error) { btns.forEach(b => b.disabled = false); return setErr(body, r.error.message); }
      location.href = "/clients/" + encodeURIComponent(CLIENT.slug) + "?tour=1";
    };
    body.querySelector("[data-none]").onclick = finish(true);
    body.querySelector("[data-next]").onclick = finish(false);
  },
};
function refreshFootageButton(body) {
  const btn = body.querySelector("[data-next]"), link = body.querySelector("#driveLink");
  if (btn) btn.disabled = uploading() || !(doneUploads("footage").length || (link && link.value.trim()));
}

// ---------- who's here ----------
async function refresh() {
  const { data } = await sbClient.from("social_client_onboarding").select("*").eq("client_id", CLIENT.id).maybeSingle();
  OB = data || OB;
}
async function homeFor(user) {
  if (ROLE === "operator") return "/operator/dashboard.html";
  const { data: ed } = await sbClient.from("social_editors").select("id").eq("id", user.id).maybeSingle();
  if (ed) return "/editor/dashboard.html";
  return CLIENT ? "/clients/" + encodeURIComponent(CLIENT.slug) : "/";
}
async function resolveWelcomeAccess(sb, user) {
  const { data: op } = await sb.from("social_operators").select("id").eq("id", user.id).maybeSingle();
  ROLE = op ? "operator" : "client";
  if (RESET && op) return { ok: true, role: "operator" };
  let client = null;
  if (op) {
    const slug = params.get("client");
    if (!slug) return RESET ? { ok: true, role: "operator" } : { ok: false, reason: "Add ?client=<portal address> to preview a client's onboarding." };
    ({ data: client } = await sb.from("social_clients").select("*").eq("slug", slug).maybeSingle());
  } else {
    const { data: claimed } = await sb.rpc("social_claim_client_invite");
    let id = claimed;
    if (!id) { const { data: cu } = await sb.from("social_client_users").select("client_id").eq("id", user.id).maybeSingle(); id = cu && cu.client_id; }
    if (id) ({ data: client } = await sb.from("social_clients").select("*").eq("id", id).maybeSingle());
  }
  if (!client) return RESET ? { ok: true, role: ROLE } : { ok: false, reason: "We couldn't find your account. Use the link from your invite email, or ask Fully Launched to send a new one." };
  return { ok: true, role: ROLE, client };
}

initAuthGate({
  resolveAccess: resolveWelcomeAccess,
  onReady: async (user, access) => {
    ME = user; CLIENT = access.client || null;
    if (CLIENT) await refresh();
    if (ROLE === "operator" && !RESET) document.getElementById("opBanner").innerHTML =
      `<div class="card meta">Previewing ${escapeHtml(CLIENT.name)}'s onboarding as the operator. What you save or upload here is saved for them.</div>`;
    current = firstOpenStep();
    render();
  },
});
</script>
