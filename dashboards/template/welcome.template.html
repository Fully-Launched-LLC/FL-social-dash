<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome to Fully Launched</title>
<style>/*__SHELL_CSS__*/</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase/config.js"></script>
</head>
<body style="display:block">

<div id="authGate" class="auth-gate"></div>
<div id="appShell" class="hidden" style="display:block">
  <div class="welcome">
    <div class="brand"><img src="/assets/logo-white.png" alt="Fully Launched" style="width:180px"></div>
    <div id="opBanner"></div>
    <nav class="steps" id="steps" aria-label="Onboarding steps"></nav>
    <main id="stepBody"></main>
  </div>
</div>

<script>/*__SHELL_JS__*/</script>
<script>/*__AUTH_JS__*/</script>
<script>
// /welcome — a new client's onboarding, one step at a time:
//   password → welcome → brand (only if they film) → questions → voice memo
//   (recorded on their phone and texted to Tait) → footage → documents →
//   portal tour → their portal.
// Every step is saved with social_client_onboarding_save() (migration 008),
// so they can stop and come back. Tait pastes the voice memo's transcript
// on the operator dashboard, which builds their Customer Data and Your
// Voice documents (api/build-documents.js). Documents aren't a step here:
// once Tait has made them, he sends them from the operator dashboard
// (Onboarding → "Email them their documents", api/send-documents.js).
//
// /welcome?mode=reset is the "Set a new password" page for anyone (the
// Forgot password email lands here), then sends them to their dashboard.
// An operator can open /welcome?client=<slug> to see a client's steps
// (nothing they do there changes their own password).

const params = new URLSearchParams(location.search);
const RESET = params.get("mode") === "reset";
let ME = null, ROLE = null, CLIENT = null, FOLDERS = {}, OB = null, DOCS = [], LINKDOCS = [];
let current = null;
// Where clients text their voice memo. Tait's number, e.g. "(555) 123-4567".
// Empty: the page just says "text it to Tait".
const TEXT_MEMO_TO = "980-312-1255";

const clientFilms = () => CLIENT && CLIENT.client_system !== "concierge";

function stepList() {
  if (RESET) return [{ key: "password", label: "New password" }];
  return [
    { key: "password", label: "Password" },
    { key: "welcome", label: "Welcome" },
    ...(clientFilms() ? [{ key: "brand", label: "Your brand" }] : []),
    { key: "questions", label: "The questions" },
    { key: "memo", label: "Voice memo" },
    { key: "footage", label: "Your footage" },
    { key: "tour", label: "Your portal" },
  ];
}
function isDone(key) {
  const o = OB || {};
  return {
    password: !!o.password_set_at, welcome: !!o.password_set_at,
    brand: !!(o.brand && Object.keys(o.brand).length),
    questions: !!(o.voice_memo_sent_at || o.transcript || (o.answers && Object.keys(o.answers).length)),
    memo: !!(o.voice_memo_sent_at || o.transcript), footage: !!o.footage_done_at,
    tour: !!o.completed_at,
  }[key];
}
function firstOpenStep() {
  const s = stepList();
  // An operator previewing skips the password step (it's the client's).
  const open = s.find(x => !(ROLE === "operator" && x.key === "password") && !isDone(x.key));
  return (open || s[s.length - 1]).key;
}

async function save(step, data) {
  if (RESET) return { data: null, error: null };
  const r = await sbClient.rpc("social_client_onboarding_save", { p_client_id: CLIENT.id, p_step: step, p_data: data || {} });
  if (!r.error && r.data) OB = r.data;
  return r;
}

function go(key) { current = key; render(); window.scrollTo(0, 0); }
function next() { const s = stepList(), i = s.findIndex(x => x.key === current); go(s[Math.min(i + 1, s.length - 1)].key); }
function back() { const s = stepList(), i = s.findIndex(x => x.key === current); go(s[Math.max(i - 1, 0)].key); }

function render() {
  document.getElementById("steps").innerHTML = RESET ? "" : stepList().map(s =>
    `<button type="button" class="${s.key === current ? "on" : isDone(s.key) ? "done" : ""}" data-step="${s.key}">${isDone(s.key) ? "✓ " : ""}${escapeHtml(s.label)}</button>`).join("");
  document.querySelectorAll("#steps [data-step]").forEach(b => b.onclick = () => go(b.dataset.step));
  const body = document.getElementById("stepBody");
  body.innerHTML = `<section class="wstep" data-current="${current}">${STEPS[current]()}</section>`;
  (WIRE[current] || (() => {}))(body);
}
const navHtml = (nextLabel, opts = {}) => `<div class="wnav">
  ${opts.noBack ? "<span></span>" : `<button type="button" data-back>Back</button>`}
  <button type="button" class="${opts.accent ? "accent" : "primary"}" data-next ${opts.disabled ? "disabled" : ""}>${escapeHtml(nextLabel)}</button></div>
  <div class="auth-error" data-err></div>`;
function wireNav(body, onNext) {
  const b = body.querySelector("[data-back]"); if (b) b.onclick = back;
  const n = body.querySelector("[data-next]");
  if (n) n.onclick = async () => {
    const err = body.querySelector("[data-err]"); err.textContent = "";
    n.disabled = true;
    try { const msg = onNext ? await onNext() : null; if (msg) { err.textContent = msg; n.disabled = false; return; } next(); }
    catch (e) { err.textContent = e.message || String(e); n.disabled = false; }
  };
}
const folderBtn = (url, label) => url
  ? `<a class="btn primary" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`
  : `<span class="meta">We're setting up this folder. You can skip this for now and come back.</span>`;

// ---------- the steps ----------
const STEPS = {
  password: () => `
    <h1>${RESET ? "Set a new password" : "Create your password"}</h1>
    <p class="lead">${RESET ? "Choose a new password for your Fully Launched login." : `Welcome to Fully Launched${CLIENT ? ", " + escapeHtml(CLIENT.name) : ""}. First, choose a password so you can sign in any time at this address.`}</p>
    ${ROLE === "operator" && !RESET ? `<div class="card meta">You're previewing as the operator. The client sets their own password here; nothing changes yours.</div>` : `
    <div class="card">
      <label for="pw1">Password (at least 8 characters)</label><input type="password" id="pw1" autocomplete="new-password">
      <label for="pw2">Type it again</label><input type="password" id="pw2" autocomplete="new-password">
    </div>`}
    ${navHtml(RESET ? "Save password" : "Save and continue", { noBack: true })}`,

  welcome: () => `
    <h1>Here's how this works</h1>
    <p class="lead">A few short steps, and we'll have what we need to make content that sounds like you. It takes about 30 minutes, and you can stop and come back any time.</p>
    <div class="card"><ol class="doc-body" style="margin:0">
      ${clientFilms() ? "<li><b>Your brand.</b> Upload your brand files, or we'll make them for you.</li>" : ""}
      <li><b>The questions.</b> Read them, then answer them in one voice memo.</li>
      <li><b>One voice memo.</b> Just talk through your answers. No script, no editing. This is how we learn your voice and your customer.</li>
      <li><b>Your footage.</b> Drop any videos you already have into your folder.</li>
      <li><b>Your portal.</b> A quick look at where everything lives.</li>
    </ol></div>
    ${navHtml("Let's start")}`,

  brand: () => {
    const b = (OB && OB.brand) || {};
    return `
    <h1>Your brand</h1>
    <p class="lead">So your videos look like you. Upload any brand files you have: your logo, fonts, colors, a brand guide, anything that shows your look.</p>
    <div class="card">
      <label>Your brand files</label>
      <div>${folderBtn(FOLDERS.important_documents, "Upload to your Important Documents folder")}</div>
      <label for="bLinks">Accounts or videos whose look you love (links)</label><textarea id="bLinks" rows="3">${escapeHtml(b.links || "")}</textarea>
    </div>
    <div class="wnav"><button type="button" data-back>Back</button>
      <span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-create>I don't have any brand files yet, create them for me</button><button type="button" class="primary" data-uploaded>I've uploaded my brand files</button></span></div>
    <div class="auth-error" data-err></div>`;
  },

  questions: () => {
    const num = TEXT_MEMO_TO ? ` at <b><a href="sms:${escapeHtml(TEXT_MEMO_TO.replace(/[^0-9+]/g, ""))}" style="color:inherit">${escapeHtml(TEXT_MEMO_TO)}</a></b>` : "";
    return `
    <h1>The questions</h1>
    <div class="card"><b>Record your answers in a voice memo and send it to Tait${num}.</b>
      <div class="meta" style="margin-top:6px">Read the questions below, then talk through your answers in your own words, the way you'd explain it to a friend. The next step shows you how.</div></div>
    <div class="card">${ONBOARDING_QUESTIONS.map(s => `<div class="qsec"><h3>${escapeHtml(s.section)}</h3><ol class="doc-body" style="margin:0 0 6px">${s.items.map(it => `
      <li class="qitem"><div class="q">${escapeHtml(it.q)}</div></li>`).join("")}</ol></div>`).join("")}</div>
    ${navHtml("Next: record your voice memo")}`;
  },

  memo: () => {
    const to = TEXT_MEMO_TO ? `Tait at <b><a href="sms:${escapeHtml(TEXT_MEMO_TO.replace(/[^0-9+]/g, ""))}" style="color:inherit">${escapeHtml(TEXT_MEMO_TO)}</a></b>` : "Tait";
    const sent = OB && (OB.voice_memo_sent_at || OB.transcript);
    return `
    <h1>Record your voice memo</h1>
    <p class="lead">Answer the questions in one voice memo, in your own words. Aim for 15 to 25 minutes. Don't worry about being polished: the way you naturally talk is exactly what we want.</p>
    <div class="card"><ol class="doc-body" style="margin:0">
      <li>Open the <b>Voice Memos</b> app on your phone (or any recorder) and tap record.</li>
      <li>Talk through the questions from the last step. Keep them open on another screen if that helps.</li>
      <li>Text the recording to ${to}.</li>
    </ol>
    ${TEXT_MEMO_TO ? `<div class="meta" style="margin-top:10px">Tait's number: <b>${escapeHtml(TEXT_MEMO_TO)}</b></div>` : ""}</div>
    ${sent ? `<div class="card"><b>Got it, thanks.</b><div class="meta">We'll turn your voice memo into your documents and email them to you when they're ready. They'll also be on your portal's Documents page.</div></div>` : ""}
    ${navHtml(sent ? "Continue" : "I've texted it", { accent: !sent })}
    <div style="margin-top:10px"><button type="button" class="reject" data-later>I'll send it later</button></div>`;
  },

  footage: () => `
    <h1>Your existing footage</h1>
    <p class="lead">Any videos you've already made, like past posts, clips or interviews, help us learn what works for you. Drop them into your Previous Content folder. Big files are fine.</p>
    <div class="card">${folderBtn(FOLDERS.previous_content || FOLDERS.footage_uploads, "Open my Previous Content folder")}</div>
    <div class="wnav"><button type="button" data-back>Back</button>
      <span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-none>I don't have any</button><button type="button" class="primary" data-uploaded>I've uploaded my footage</button></span></div>
    <div class="auth-error" data-err></div>`,

  tour: () => `
    <h1>Your portal</h1>
    <p class="lead">Here's where everything lives from now on.</p>
    <div class="card"><div class="doc-body">
      <p><b>To Do.</b> Everything that needs you: ideas to approve, videos to film, and finished videos to approve before they post. The Time sensitive tab shows what's due soon.</p>
      <p><b>Content Calendar.</b> What posts each day and where.</p>
      <p><b>Documents.</b> Your Customer Data, Your Voice and other important documents. We'll email you when they're ready.</p>
      <p><b>Your footage folder.</b> Where your raw clips go${clientFilms() ? " when you film" : ""}.</p>
      <p>Sign in any time at <b>${escapeHtml(location.host)}</b> with your email and password.</p>
    </div></div>
    ${navHtml("Go to my portal", { accent: true })}`,
};

const WIRE = {
  password: body => wireNav(body, async () => {
    if (ROLE === "operator" && !RESET) return null;
    const a = body.querySelector("#pw1").value, b = body.querySelector("#pw2").value;
    if (a.length < 8) return "Use at least 8 characters.";
    if (a !== b) return "Those two don't match.";
    const { error } = await sbClient.auth.updateUser({ password: a });
    if (error) return error.message;
    if (RESET) { location.href = await homeFor(ME); return "Saved. Taking you to your dashboard…"; }
    const r = await save("password");
    return r.error ? r.error.message : null;
  }),
  welcome: body => wireNav(body),
  brand: body => {
    body.querySelector("[data-back]").onclick = back;
    const done = files => async () => {
      const r = await save("brand", { files, links: body.querySelector("#bLinks").value.trim() });
      if (r.error) body.querySelector("[data-err]").textContent = r.error.message; else next();
    };
    body.querySelector("[data-create]").onclick = done("create_for_me");
    body.querySelector("[data-uploaded]").onclick = done("uploaded");
  },
  questions: body => wireNav(body),
  memo: body => {
    wireNav(body, async () => {
      if (OB && (OB.voice_memo_sent_at || OB.transcript)) return null;
      const r = await save("memo_sent");
      return r.error ? r.error.message : null;
    });
    body.querySelector("[data-later]").onclick = next;
  },
  footage: body => {
    body.querySelector("[data-back]").onclick = back;
    const done = async () => { const r = await save("footage"); if (r.error) body.querySelector("[data-err]").textContent = r.error.message; else next(); };
    body.querySelector("[data-none]").onclick = done;
    body.querySelector("[data-uploaded]").onclick = done;
  },
  tour: body => wireNav(body, async () => {
    const r = await save("done");
    if (r.error) return r.error.message;
    location.href = "/clients/" + encodeURIComponent(CLIENT.slug);
    return "Taking you to your portal…";
  }),
};

// ---------- documents ----------
async function refresh() {
  const [o, d, l] = await Promise.all([
    sbClient.from("social_client_onboarding").select("*").eq("client_id", CLIENT.id).maybeSingle(),
    sbClient.from("social_client_generated_docs").select("*").eq("client_id", CLIENT.id).order("kind"),
    sbClient.from("social_client_documents").select("title,url").eq("client_id", CLIENT.id).order("position"),
  ]);
  OB = o.data || OB; DOCS = d.data || []; LINKDOCS = l.data || [];
}

// ---------- who's here ----------
async function homeFor(user) {
  if (ROLE === "operator") return "/operator/dashboard.html";
  const { data: ed } = await sbClient.from("social_editors").select("id").eq("id", user.id).maybeSingle();
  if (ed) return "/editor/dashboard.html";
  return CLIENT ? "/clients/" + encodeURIComponent(CLIENT.slug) : "/";
}
async function resolveWelcomeAccess(sb, user) {
  const { data: op } = await sb.from("social_operators").select("id").eq("id", user.id).maybeSingle();
  ROLE = op ? "operator" : "client";
  if (RESET && op) return { ok: true, role: "operator" };
  let client = null;
  if (op) {
    const slug = params.get("client");
    if (!slug) return RESET ? { ok: true, role: "operator" } : { ok: false, reason: "Add ?client=<portal address> to preview a client's onboarding." };
    ({ data: client } = await sb.from("social_clients").select("*").eq("slug", slug).maybeSingle());
  } else {
    const { data: claimed } = await sb.rpc("social_claim_client_invite");
    let id = claimed;
    if (!id) { const { data: cu } = await sb.from("social_client_users").select("client_id").eq("id", user.id).maybeSingle(); id = cu && cu.client_id; }
    if (id) ({ data: client } = await sb.from("social_clients").select("*").eq("id", id).maybeSingle());
  }
  if (!client) return RESET ? { ok: true, role: ROLE } : { ok: false, reason: "We couldn't find your account. Use the link from your invite email, or ask Fully Launched to send a new one." };
  return { ok: true, role: ROLE, client };
}

initAuthGate({
  resolveAccess: resolveWelcomeAccess,
  onReady: async (user, access) => {
    ME = user; CLIENT = access.client || null;
    if (CLIENT) {
      const { data: f } = await sbClient.from("social_drive_folder_links").select("*").eq("client_id", CLIENT.id).maybeSingle();
      FOLDERS = f || {};
      await refresh();
    }
    if (ROLE === "operator" && !RESET) document.getElementById("opBanner").innerHTML =
      `<div class="card meta">Previewing ${escapeHtml(CLIENT.name)}'s onboarding as the operator. What you save here is saved for them.</div>`;
    current = RESET ? "password" : firstOpenStep();
    render();
  },
});
</script>
</body>
</html>
